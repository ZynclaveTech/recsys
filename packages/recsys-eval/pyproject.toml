[project]
name = "recsys-eval"
version = "0.1.0.dev0"
description = "Offline evaluation and promotion gating for recommender systems."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "recommender-systems",
    "evaluation",
    "ndcg",
    "ranking-metrics",
    "mlops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Deliberately empty. The metrics are pure stdlib, and the fixture and gate
# layers talk to your data through protocols rather than through pandas,
# numpy, or an ORM. Adding a dependency here should require an argument.
dependencies = []

[project.urls]
Source = "https://github.com/ZynclaveTech/recsys"
Issues = "https://github.com/ZynclaveTech/recsys/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys_eval"]
