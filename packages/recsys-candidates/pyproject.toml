[project]
name = "recsys-candidates"
version = "0.1.0"
description = "Composable candidate generation for recommender systems."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zynclave Tech", email = "info@zynclave.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["recommender-systems", "retrieval", "candidate-generation", "rank-fusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Same rule as recsys-eval: adding one should require an argument. Sources
# reach your data through a protocol, so the library never needs a client.
dependencies = []

[project.urls]
Homepage = "https://vync.live"
Source = "https://github.com/ZynclaveTech/recsys"
Issues = "https://github.com/ZynclaveTech/recsys/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys_candidates"]
